# citizenlk.com homepage. Deploy: npx wrangler deploy -c workers/home/wrangler.toml
name = "citizenlk-home"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = false
routes = [
  { pattern = "citizenlk.com", custom_domain = true },
  { pattern = "www.citizenlk.com", custom_domain = true },
]

[assets]
directory = "../../site"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true
