# citizenlk.com homepage. Deploy: npx wrangler deploy -c workers/home/wrangler.toml
name = "citizenlk-home"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "citizenlk.com", custom_domain = true },
  { pattern = "www.citizenlk.com", custom_domain = true },
]

[assets]
directory = "../../site"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true

# Anonymous visitor counts (src/events.js); the admin panel reads them. Counting is off until the EV_KEY secret exists (or OTP_PEPPER, on the services).
[[analytics_engine_datasets]]
binding = "EVENTS"
dataset = "citizenlk_events"
