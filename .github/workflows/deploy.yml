# Deploy from GitHub's servers (2026-11-09), like LankaWatch's deploy.yml: the container image is built and pushed to Cloudflare's
# registry over GitHub's link, not from the owner's machine. Same rules as a hand deploy (AGENTS.md "Deploying"): only `main`,
# only green (Python + Node tests run first), and only when the owner asked for it.
#   gh workflow run deploy.yml -f target=bills      (Bill Assistant: Worker gov-rag-llm + its container)
#   gh workflow run deploy.yml -f target=admin      (admin panel Worker, no container)
#   gh run watch
# Afterwards record it in AGENTS.md "Deployed vs main" (the job summary prints the commit, build id and Worker version).
# Repo secret CLOUDFLARE_API_TOKEN needs Workers Scripts: Edit, Workers KV Storage: Edit, Containers: Edit, Zone: Read.
# Not here: Procurement Rules (its image bakes data/procurement/index.sqlite, which is not in the repo) and the homepage
# (needs scripts/build_site.py on the published index first).
name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        type: choice
        options: [bills, admin]
        default: bills

concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e81ea992523c4e14d3d1a89f10732576
    steps:
      - name: Refuse without a token or off main
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Add the repo secret CLOUDFLARE_API_TOKEN (see the top of this file)"; exit 1; }
          test "$GITHUB_REF" = refs/heads/main || { echo "::error::Deploy only from main (got $GITHUB_REF)"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-billrag.txt
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: pip install -r requirements-billrag.txt pytest
      - run: python -m pytest tests -q
      - run: npm ci && npm test
      - uses: docker/setup-buildx-action@v3
        if: inputs.target == 'bills'
      - name: Deploy
        run: |
          set -o pipefail
          case "${{ inputs.target }}" in
            bills) npx wrangler deploy 2>&1 | tee deploy.log ;;
            admin) npx wrangler deploy -c workers/admin/wrangler.toml 2>&1 | tee deploy.log ;;
          esac
      - name: Summary
        if: always()
        run: |
          {
            echo "### Deployed ${{ inputs.target }}"
            echo "- commit: \`$(git rev-parse --short HEAD)\`"
            echo "- python build id: \`$(python -c 'from billrag.chatlog import build_id; print(build_id())')\`"
            grep -E "Current Version ID|Modified application|No changes|image" deploy.log 2>/dev/null | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"
