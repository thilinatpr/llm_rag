name = "gov-rag-llm"
main = "src/worker.js"
compatibility_date = "2026-11-01"
# Bill Assistant lives on its own subdomain; the old workers.dev address and preview URLs are off.
workers_dev = false
preview_urls = false
routes = [{ pattern = "bills.citizenlk.com", custom_domain = true }]

# Static pages are only reachable through the Worker, so they sit behind the OTP login.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Sessions and one-time codes. Create with: npx wrangler kv namespace create AUTH   (paste the id below)
[[kv_namespaces]]
binding = "AUTH"
id = "a44e7e8cc8f0444ba865ea162820193d"

# The Python chat UI (billrag serve) runs in a Cloudflare Container; the Worker above is its only way in.
[[containers]]
class_name = "BillragContainer"
image = "./Dockerfile"
instance_type = "basic"  # 1/4 vCPU, 1 GiB. "lite" (256 MiB, 1/16 vCPU) fit in memory but was too slow.
max_instances = 1

[[durable_objects.bindings]]
name = "BILLRAG"
class_name = "BillragContainer"

# Daily counters for the public lane (src/quota-do.js, src/public.js).
[[durable_objects.bindings]]
name = "QUOTA"
class_name = "QuotaCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BillragContainer"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["QuotaCounter"]

# Keep Worker logs (incl. upstream_failed errors) so problems can be read after the fact.
[observability]
enabled = true

# Hourly: the DeepSeek credit check (src/balance.js) and the settings report for the admin panel (src/public.js).
[triggers]
crons = ["17 * * * *"]

[vars]
# Who gets the low-credit email, and below how many US dollars. $5 is about 4 days at the public lane's daily ceiling.
ALERT_EMAIL = "thilinatpr@gmail.com"
BALANCE_ALERT_USD = "5"
# Comma-separated. This is the only allowlist: nothing needs verifying on the Cloudflare side.
ALLOWED_EMAILS = "thilinatpr@gmail.com"
# Any address on a domain onboarded under Cloudflare Email -> Email Sending.
FROM_ADDRESS = "login@citizenlk.com"
# Cloudflare account id (not secret). The API token goes in the CF_EMAIL_TOKEN secret.
CF_ACCOUNT_ID = "e81ea992523c4e14d3d1a89f10732576"
# R2 bucket holding the built index (index.sqlite + vectors.npz); the container restores it on start.
R2_BUCKET = "gov-rag"
# Chat model provider: "workers-ai" (default, gpt-oss-120b via Cloudflare) | "deepseek" (needs the DEEPSEEK_API_KEY secret; model
# CHAT_MODEL, default deepseek-flash; grading thinking off). See src/chatconfig.js and AGENTS.md "Priorities, DeepSeek". Switch back
# by setting this to "workers-ai" and redeploying.
CHAT_PROVIDER = "deepseek"
# Translation of non-English questions (billrag/translate.py): off | script | ai.
# script = Sinhala/Tamil by Unicode script, no extra model call for English. ai = one extra call on every other question
# (English too) that detects ANY language and translates it. Read by the container when it starts.
TRANSLATE = "ai"
# Model for the translate calls only (detect + translate in, translate out). Unset = the chat model (gpt-oss-120b).
# A Workers AI chat model or the Meta machine-translation model @cf/meta/m2m100-1.2b. If it errors or returns unusable
# output, the chat model is tried instead (see the warning in the chat log). Llama 3.3 gave the correct Sinhala legal terms
# where gpt-oss did not, but is slower on long answers (~37 s vs ~7 s); see AGENTS.md "Translation model".
TRANSLATE_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
# Public (anonymous) questions behind a Cloudflare Turnstile check, with daily quotas: see src/public.js and AGENTS.md "Public lane".
# OFF until set to "on". Needs the TURNSTILE_SECRET Worker secret (exists) and the site key below (public, not a secret).
PUBLIC_CHAT = "on"
TURNSTILE_SITEKEY = "0x4AAAAAAF2W2gpEdNI7gfcY"
# Daily allowances (reset at midnight in Sri Lanka). Per visitor / per IP (backstop: mobile users share IPs) / whole public lane.
PUBLIC_DAILY_PER_COOKIE = "10"
PUBLIC_DAILY_PER_IP = "300"
PUBLIC_DAILY_GLOBAL = "500"
PUBLIC_COOKIES_PER_IP = "50"
# Optional, ignored when the container is bound: proxy signed-in requests to another server instead.
# ORIGIN = "https://billrag.example.com"
