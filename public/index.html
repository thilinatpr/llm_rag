<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sri Lanka Bills Chat</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1a1a1a; --mut:#6b6b6b; --line:#ddd; --me:#e8f0fe; --bot:#f5f5f5; --acc:#1a56db; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121212; --fg:#eee; --mut:#999; --line:#333; --me:#1e2a44; --bot:#1e1e1e; --acc:#6ea0ff; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--fg); display:flex; flex-direction:column; height:100dvh; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:12px; }
  header h1 { font-size:1rem; margin:0; }
  label { font-size:.85rem; color:var(--mut); white-space:nowrap; }
  select { font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:1px 4px; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:46rem; padding:10px 14px; border-radius:10px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .me { background:var(--me); align-self:flex-end; }
  .bot { background:var(--bot); align-self:flex-start; }
  .err { color:#d33; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }
  input[type=text] { flex:1; padding:10px 12px; font:inherit; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); }
  button { padding:10px 16px; font:inherit; border:0; border-radius:8px; background:var(--acc); color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .hint { color:var(--mut); font-size:.9rem; }
  .md { white-space:normal; }
  .md p { margin:0 0 .6em; } .md > :last-child { margin-bottom:0; }
  .md ul, .md ol { margin:0 0 .6em; padding-left:1.4em; } .md li { margin:.15em 0; }
  .md h3, .md h4 { font-size:1rem; margin:.4em 0 .3em; }
  .md code { font:.9em ui-monospace,monospace; background:var(--line); padding:0 .25em; border-radius:4px; }
  .md table { border-collapse:collapse; margin:0 0 .6em; font-size:.92rem; } .md td, .md th { border:1px solid var(--line); padding:3px 6px; text-align:left; }
  .md hr { border:0; border-top:1px solid var(--line); margin:.6em 0; }
  .step { color:var(--mut); font-style:italic; }
  .draft::after { content:" \25cf"; color:var(--mut); animation:blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:0; } }
</style></head>
<body>
<header>
  <h1>Sri Lanka Bills Chat <small id="status" class="hint" title="Server status"></small></h1>
  <span><label title="Fast: the model thinks less before writing (answers start in seconds). Thorough: more careful, slower.">Answer
    <select id="speed"><option value="thorough">Thorough</option><option value="fast">Fast</option></select></label>
  <label style="margin-left:10px"><input type="checkbox" id="searchOnly"> Search only (no LLM)</label>
  <button id="out" type="button" title="Sign out" style="margin-left:12px;padding:4px 10px">Sign out</button></span>
</header>
<div id="log"><div class="hint">Ask about bills from documents.gov.lk, e.g. "How does the 2026 terrorism bill limit detention?".
Answers explain the text and are not legal advice.</div></div>
<form id="f"><input type="text" id="q" placeholder="Ask a question..." autocomplete="off" autofocus>
<button id="send">Send</button></form>
<script>
const log = document.getElementById('log'), q = document.getElementById('q'),
      btn = document.getElementById('send'), so = document.getElementById('searchOnly'), speed = document.getElementById('speed');
try { const v = localStorage.getItem('billrag-speed'); if (v === 'fast' || v === 'thorough') speed.value = v; } catch (e) {}
speed.onchange = () => { try { localStorage.setItem('billrag-speed', speed.value); } catch (e) {} };
document.getElementById('out').onclick = async () => {
  try { await fetch('/logout', {method: 'POST'}); } catch (e) {}
  location.href = '/login';
};
let session = null;
try { session = localStorage.getItem('billrag-session'); } catch (e) {}
if (!session) {
  session = Math.random().toString(36).slice(2);
  try { localStorage.setItem('billrag-session', session); } catch (e) {}
}
function add(text, cls) {
  const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
// --- md:start --- Minimal, safe Markdown for model answers: everything is HTML-escaped first, then only a few
// constructs become tags (paragraphs, -/*/1. lists, #-headings, tables, **bold**, *italic*, `code`). Leftover * marks are dropped.
function renderMarkdown(src) {
  const esc = (t) => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const inline = (t) => {
    const codes = [];
    t = esc(t).replace(/`([^`\n]+)`/g, (_, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
    t = t.replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g, '<strong>$1</strong>')
         .replace(/__(?=\S)([\s\S]*?\S)__/g, '<strong>$1</strong>')
         .replace(/(^|[^\w*])\*(?=[^\s*])([^*\n]*?[^\s*])\*(?![\w*])/g, '$1<em>$2</em>')
         .replace(/\*+/g, '');
    return t.replace(/\u0000(\d+)\u0000/g, (_, i) => '<code>' + codes[+i] + '</code>');
  };
  const cells = (l) => l.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
  const lines = String(src || '').replace(/\r\n?/g, '\n').split('\n');
  const out = []; let para = [], list = null;
  const flushPara = () => { if (para.length) out.push('<p>' + para.map(inline).join('<br>') + '</p>'); para = []; };
  const flushList = () => { if (list) out.push('<' + list.tag + '>' + list.items.map((i) => '<li>' + inline(i) + '</li>').join('') + '</' + list.tag + '>'); list = null; };
  const flush = () => { flushPara(); flushList(); };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i], t = line.trim(); let m;
    if (!t) { flush(); continue; }
    if (/^([-*_])(\s*\1){2,}$/.test(t)) { flush(); out.push('<hr>'); continue; }
    if ((m = t.match(/^#{1,6}\s+(.*?)\s*#*$/))) { flush(); out.push('<h4>' + inline(m[1]) + '</h4>'); continue; }
    if (t.startsWith('|') && i + 1 < lines.length && /^\|?\s*:?-{2,}/.test(lines[i + 1].trim())) {
      flush(); const head = cells(t); i++;
      const rows = []; while (i + 1 < lines.length && lines[i + 1].trim().startsWith('|')) rows.push(cells(lines[++i]));
      out.push('<table><tr>' + head.map((c) => '<th>' + inline(c) + '</th>').join('') + '</tr>' +
               rows.map((r) => '<tr>' + r.map((c) => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') + '</table>');
      continue;
    }
    const ul = t.match(/^[-*+\u2022]\s+(.*)$/), ol = t.match(/^\d+[.)]\s+(.*)$/);
    if (ul || ol) {
      flushPara(); const tag = ul ? 'ul' : 'ol';
      if (!list || list.tag !== tag) { flushList(); list = {tag, items: []}; }
      list.items.push((ul || ol)[1]); continue;
    }
    if (list && /^\s+/.test(line)) { list.items[list.items.length - 1] += ' ' + t; continue; }
    flushList(); para.push(t);
  }
  flush();
  return out.join('');
}
// --- md:end ---
const statusEl = document.getElementById('status');
const setStatus = (t) => { statusEl.textContent = t; };
// The page is static and loads instantly; this wakes the server (it sleeps when idle) while you read and type.
(async function warm() {
  setStatus('\u25cf waking server...');
  for (let i = 0; i < 100; i++) {
    try { const r = await fetch('/healthz', {cache: 'no-store'}); if (r.ok) { setStatus('\u25cf ready'); return; } } catch (e) {}
    await new Promise((r) => setTimeout(r, 3000));
  }
  setStatus('\u25cf server not responding');
})();
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
// A dropped connection (TypeError) usually means the container was asleep and is starting; wait until it answers, then retry once.
async function waitUntilUp(note) {
  for (let i = 0; i < 60; i++) {
    note.textContent = 'The server is waking up (this can take a minute or two)... ' + (i * 3) + 's';
    try { const r = await fetch('/healthz', {cache: 'no-store'}); if (r.ok) return true; } catch (e) {}
    await sleep(3000);
  }
  return false;
}
async function post(path, body, note) {
  const send = () => fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  let r;
  try { r = await send(); }
  catch (e) {
    if (!(await waitUntilUp(note))) throw new Error('The server did not come back after 3 minutes. Try again shortly.');
    note.textContent = 'Server is up. Asking again...';
    r = await send();
  }
  let j = {};
  try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(`${j.error || r.statusText || 'Request failed'} (HTTP ${r.status})`);
  return j;
}
// Streamed answer (/api/ask/stream, server-sent events): step names while it searches and checks, the answer as it is
// written, then the final checked answer (citations verified, quotes matched to the official text) replaces the draft.
// Returns null when this server has no streaming endpoint (e.g. an older container during a rollout): use /api/ask then.
const STEPS = {translate_in: 'Reading your question', condense: 'Reading the conversation', retrieve0: 'Searching the bills',
  evaluate0: 'Checking which clauses answer it', retrieve1: 'Searching again', evaluate1: 'Checking the new results',
  bill_sections: "Reading the bill's sections", answer_direct: 'Writing the answer', summarise: 'Writing the answer',
  translate_out: 'Translating the answer'};
async function askStream(body, el) {
  const send = () => fetch('/api/ask/stream', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  let r;
  try { r = await send(); }
  catch (e) {
    if (!(await waitUntilUp(el))) throw new Error('The server did not come back after 3 minutes. Try again shortly.');
    el.textContent = 'Server is up. Asking again...';
    r = await send();
  }
  if (r.status === 404) return null;
  if (!r.ok || !(r.headers.get('Content-Type') || '').includes('text/event-stream')) {
    let j = {}; try { j = await r.json(); } catch (e) {}
    throw new Error(`${j.error || r.statusText || 'Request failed'} (HTTP ${r.status})`);
  }
  const reader = r.body.getReader(), dec = new TextDecoder();
  let buf = '', draft = '', final = null, queued = false, closed = false;
  // `closed`: a draft repaint queued before the end must not overwrite the final answer the caller puts in afterwards
  const paint = () => { queued = false; if (closed) return; el.innerHTML = renderMarkdown(draft); el.classList.add('md', 'draft'); el.classList.remove('step'); log.scrollTop = log.scrollHeight; };
  const step = (t) => { if (!draft) { el.textContent = t + '...'; el.classList.add('step'); } };
  try { for (;;) {
    const {value, done} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream: true});
    let i;
    while ((i = buf.indexOf('\n\n')) >= 0) {
      const raw = buf.slice(0, i); buf = buf.slice(i + 2);
      let kind = 'message', data = '';
      for (const line of raw.split('\n')) {
        if (line.startsWith('event:')) kind = line.slice(6).trim();
        else if (line.startsWith('data:')) data += line.slice(5).trim();
      }
      let d = {}; try { d = JSON.parse(data || '{}'); } catch (e) {}
      if (kind === 'status') step(STEPS[d.step] || 'Working');
      else if (kind === 'reset') { if (draft) { draft = ''; el.classList.remove('draft', 'md'); step('Checking the answer and writing it again'); } }
      else if (kind === 'token') { draft += d.text || ''; if (!queued) { queued = true; requestAnimationFrame(paint); } }
      else if (kind === 'done') final = d.answer || '';
      else if (kind === 'error') throw new Error(d.error || 'The server reported an error');
    }
  } } finally { closed = true; }
  if (final === null) throw new Error('The connection closed before the answer was complete. Try again.');
  return final;
}
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = q.value.trim(); if (!text) return;
  q.value = ''; btn.disabled = true; add(text, 'me');
  const label = so.checked ? 'Searching...' : 'Thinking...';
  const wait = add(label, 'bot');
  const slow = setTimeout(() => { if (wait.textContent === label) wait.textContent = label + ' still working; answers take 15-30s, longer if the server was asleep.'; }, 8000);
  try {
    if (so.checked) {
      const j = await post('/api/search', {query: text, k: 6}, wait);
      wait.textContent = j.results.join('\n\n---\n\n');
    } else {
      const body = {session, question: text, answer: speed.value};
      let answer = await askStream(body, wait);
      if (answer === null) answer = (await post('/api/ask', body, wait)).answer;
      wait.classList.remove('draft', 'step');
      wait.innerHTML = renderMarkdown(answer); wait.classList.add('md');
    }
  } catch (err) { wait.classList.remove('draft', 'step', 'md'); wait.textContent = 'Error: ' + err.message; wait.classList.add('err'); }
  clearTimeout(slow);
  btn.disabled = false; q.focus(); log.scrollTop = log.scrollHeight;
});
</script></body></html>
